# === Paths ===
included:
  - macos/PbFoundation
  - macos/PbCore
  - macos/PbFeatures
  - macos/PolybridgeMonitor

excluded:
  - macos/build
  - macos/PolybridgeMonitor/.vscode-build
  - macos/PolybridgeMonitor/.build
  - macos/PbFoundation/PbUtilities/.build
  - macos/PbFoundation/PbCommon/.build
  - macos/PbFoundation/PbUI/.build
  - macos/PbCore/MonitorCore/.build
  - macos/PbCore/PbRepository/.build
  - macos/PbFeatures/MainWindowFeature/.build
  - macos/PbFeatures/MenuBarFeature/.build
  - macos/PbFeatures/SettingsFeature/.build

# Existing MonitorCore source violations; anything new still fails.
baseline: .swiftlint-baseline.json

# === Rules to Disable ===
disabled_rules:
  - blanket_disable_command
  - multiple_closures_with_trailing_closure
  - trailing_whitespace
  - void_function_in_ternary

# === Opt-in Rules ===
opt_in_rules:
  - contains_over_first_not_nil

# === Complexity Rules ===
cyclomatic_complexity:
  ignores_case_statements: true
function_body_length:
  warning: 60
  error: 100
function_parameter_count:
  warning: 5
  error: 6
nesting:
  type_level: 2
type_body_length:
  warning: 500
  error: 600

# === Style Rules ===
force_cast: warning
force_try: warning
line_length:
  warning: 160
  error: 200
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: true
  ignores_interpolated_strings: false

# === Metrics Rules ===
file_length:
  warning: 600
  error: 700
large_tuple:
  warning: 5
  error: 6

# === Naming Rules ===
identifier_name:
  min_length:
    error: 3
  excluded:
    - am
    - h
    - id
    - int
    - iv
    - n
    - no
    - of
    - ok
    - pb
    - pm
    - to
    - up
    - url
    - uv
    - v
    - vm
    - x
    - y

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - VM

# === Custom Rules ===
custom_rules:
  no_literal_font_size:
    name: "No literal font size"
    regex: '\.system\s*\(\s*size\s*:'
    included: '(^|/)macos/(PbFoundation/PbUI|PbFeatures/(MainWindowFeature|MenuBarFeature|SettingsFeature))/Sources/'
    message: "Use Font.pb(_:weight:design:) from PbUI's type scale instead of a literal size."
    severity: error

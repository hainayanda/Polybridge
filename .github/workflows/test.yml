name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  swift:
    if: github.event.pull_request.draft != true
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos/PbFoundation/PbCommon
            mode: aggregate
          - package: macos/PbFoundation/PbUI
            mode: aggregate
          - package: macos/PbFoundation/PbUtilities
            mode: aggregate
          - package: macos/PbCore/MonitorCore
            mode: aggregate
          - package: macos/PbCore/PbRepository
            mode: aggregate
          - package: macos/PbFeatures/MainWindowFeature
            mode: suites
          - package: macos/PbFeatures/MenuBarFeature
            mode: aggregate
          - package: macos/PbFeatures/SettingsFeature
            mode: aggregate
          - package: macos/PolybridgeMonitor
            mode: aggregate
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
          version=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
          major=${version%%.*}
          minor=${version#*.}
          if [ -z "$version" ] || [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "Swift 6.2 or later is required (found '${version}')" >&2
            exit 1
          fi
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' | sed 's/ $//' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.build
          key: swift-build-${{ runner.arch }}-${{ steps.xcode.outputs.xcode }}-${{ matrix.package }}-${{ hashFiles('macos/**/Package.swift', 'macos/**/Package.resolved') }}

      - name: Guarded swift tests
        env:
          PB_NATIVE_SIDEBAR_BENCHMARK: "1"
        # AppKit layout fixtures share the main actor with async view-model tests:
        # the runner serializes execution and fail-closed validates identity
        # coverage, event streams, summaries and XCTest silence. MainWindow runs
        # one fresh process per suite; every other package one guarded run.
        run: |
          python3 scripts/test-swift-package.py \
            --package "${{ matrix.package }}" \
            --mode "${{ matrix.mode }}" \
            --output-dir "$RUNNER_TEMP/pb-swift-test-logs"

      - name: Preserve Swift test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pb-swift-test-logs
          retention-days: 7

  app:
    if: github.event.pull_request.draft != true
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build the app bundle
        run: macos/build-app.sh

  python:
    if: github.event.pull_request.draft != true
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: pytest
        run: |
          test_home=$(mktemp -d)
          mkdir -p "$test_home/codex"
          HOME="$test_home" CODEX_HOME="$test_home/codex" uv run pytest -q -p no:cacheprovider
